name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build with e2e desk gate
        run: bun run build
        env:
          VITE_TECHO_E2E: "1"
      - id: cf
        name: Enable workers.dev + Preview URLs (does not change orbit.lyz.cloud)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          echo "Before:"
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${api}/workers/scripts/subscription-calculator/subdomain"
          echo
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Cloudflare-Workers-Script-Api-Date: 2025-08-01" \
            "${api}/workers/scripts/subscription-calculator/subdomain" \
            --data '{"enabled":true,"previews_enabled":true}'
          echo
          subdomain="$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${api}/workers/subdomain" | jq -er '.result.subdomain')"
          echo "subdomain=$subdomain" >> "$GITHUB_OUTPUT"
      - id: preview
        name: Create or update Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
          WORKERS_SUBDOMAIN: ${{ steps.cf.outputs.subdomain }}
        run: |
          set -euo pipefail
          cat > /tmp/preview.secrets.env <<'EOF'
          BETTER_AUTH_SECRET=preview-not-production
          GITHUB_CLIENT_ID=preview
          GITHUB_CLIENT_SECRET=preview
          EOF
          set +e
          bunx wrangler preview \
            --name "pr-${PR}" \
            --ignore-base-config \
            --secrets-file /tmp/preview.secrets.env \
            --json > /tmp/wrangler-preview.out 2>/tmp/wrangler-preview.err
          status=$?
          set -e
          cat /tmp/wrangler-preview.err
          cat /tmp/wrangler-preview.out
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          json="$(cat /tmp/wrangler-preview.out /tmp/wrangler-preview.err | sed -n '/^{/,$p')"
          preview_url="$(printf '%s\n' "$json" | jq -r '.preview.urls[0] // .deployment.urls[0] // empty' || true)"
          if [ -z "$preview_url" ] || [ "$preview_url" = "null" ]; then
            echo "wrangler preview returned empty urls. JSON was:" >&2
            printf '%s\n' "$json" >&2
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
      - name: Probe Preview
        run: curl --fail --show-error --silent --output /dev/null --write-out "%{http_code}\n" "$PREVIEW_URL/"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
      - name: Comment Preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "$(cat <<EOF
          ## Preview (Workers Preview — not production)

          **${PREVIEW_URL}**

          Hand-feel (no GitHub OAuth, no production D1). Idle desk = 总览. There is no overview Widget.

          - login-only (only \`widget-login\`): ${PREVIEW_URL}/
          - enter fly-in → desk (four content widgets): ${PREVIEW_URL}/?e2e=browse
          - From login-only, **进入桌面** plays login flying out then the four widgets flying in
          - Pick a widget to hold; click the wood desk to put down; **退出** plays exit

          This is \`wrangler preview --name pr-${PR}\`. It does **not** deploy to \`orbit.lyz.cloud\`.
          EOF
          )"

  cleanup:
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Delete Preview
        run: bunx wrangler preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
