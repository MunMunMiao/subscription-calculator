name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build with e2e browse gate
        run: bun run build
        env:
          VITE_TECHO_E2E: "1"
      - id: preview
        name: Create or update Preview
        run: |
          set -o pipefail
          cat > /tmp/preview.secrets.env <<'EOF'
          BETTER_AUTH_SECRET=preview-not-production
          GITHUB_CLIENT_ID=preview
          GITHUB_CLIENT_SECRET=preview
          EOF
          output="$(bunx wrangler preview \
            --name "pr-${{ github.event.pull_request.number }}" \
            --ignore-base-config \
            --secrets-file /tmp/preview.secrets.env \
            --json)"
          printf '%s\n' "$output"
          preview_url="$(printf '%s' "$output" | jq -er '.preview.urls[0] // .preview_urls[0] // .deployment.urls[0] // .deployment_urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Probe Preview
        run: curl --fail --show-error --silent --output /dev/null --write-out "%{http_code}\n" "$PREVIEW_URL/"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
      - name: Comment Preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "$(cat <<EOF
          ## Preview (Workers Preview — not production)

          **${PREVIEW_URL}**

          Hand-feel (no GitHub OAuth, no production D1):
          - Sealed landing (手帐 + GitHub 登录): ${PREVIEW_URL}/
          - Cut签 / 记一笔 / 墨迹生长: ${PREVIEW_URL}/?e2e=browse

          This is \`wrangler preview --name pr-${PR}\`. It does **not** deploy to \`orbit.lyz.cloud\`.
          EOF
          )"

  cleanup:
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Delete Preview
        run: bunx wrangler preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
